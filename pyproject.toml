[project]
name = "daylog"
version = "0.1.0"
description = "Tracker personale per la costanza: abitudini giornaliere e una nota al giorno"
readme = "README.md"
authors = [{ name = "fedous" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errori base, I: ordine degli import, UP: sintassi Python moderna, B: bug comuni
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
