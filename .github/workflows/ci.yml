# Lint e test a ogni push e a ogni pull request
name: CI

on:
  push:
  pull_request:
  # Pulsante "Run workflow" nella scheda Actions
  workflow_dispatch:

# Il token del workflow può solo leggere la repo
permissions:
  contents: read

# Un nuovo push sullo stesso ramo annulla il giro ancora in corso
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Action fissate al commit (più sicuro di un tag, che si può spostare); la versione è nel commento
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --locked: errore se uv.lock non è allineato al pyproject.toml
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Docker c'è già sul runner: testcontainers avvia postgres:18 come in locale
      - run: uv run pytest
